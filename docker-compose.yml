services:
  redis:
    image: redis:7-alpine

  flaresolverr:
    image: ghcr.io/thephaseless/byparr:latest
    restart: unless-stopped
    shm_size: "1gb"
    tmpfs:
      - /tmp:exec,mode=1777,size=1G

  barestreams:
    build: .
    depends_on:
      redis:
        condition: service_started
      flaresolverr:
        condition: service_started
    command: ["sh", "-c", "sleep 5 && node dist/index.js"]
    ports:
      - "19080:80"
    environment:
      - REDIS_URL=redis://redis:6379
      - REDIS_TTL_HOURS=168
      - MAX_REQUEST_WAIT_SECONDS=${MAX_REQUEST_WAIT_SECONDS:-15}
      - JACKETT_URL=${JACKETT_URL:-}
      - JACKETT_API_KEY=${JACKETT_API_KEY:-}
      - JACKETT_INDEXERS=${JACKETT_INDEXERS:-}
      - EZTV_URL=https://eztvx.to
      - YTS_URL=https://yts.gg
      - APIBAY_URL=https://apibay.org
      - X1337X_URL=https://1337x.to
      - KAT_URL=https://katcr.to,https://kickasstorrents.to
      # Byparr supports request.get but not FlareSolverr session commands.
      - FLARESOLVERR_SESSIONS=0
      - FLARESOLVERR_URL=http://flaresolverr:8191
    volumes:
      - ./data/imdb:/app/data/imdb
    networks:
      - default
      - indexers

networks:
  indexers:
    name: barestreams-indexers
